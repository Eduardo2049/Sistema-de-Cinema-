<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Film reel -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="50" cy="50" r="8" fill="white"/>
  
  <!-- Film holes -->
  <circle cx="50" cy="25" r="4" fill="white"/>
  <circle cx="50" cy="75" r="4" fill="white"/>
  <circle cx="25" cy="50" r="4" fill="white"/>
  <circle cx="75" cy="50" r="4" fill="white"/>
  
  <!-- Diagonal holes -->
  <circle cx="35" cy="35" r="4" fill="white"/>
  <circle cx="65" cy="35" r="4" fill="white"/>
  <circle cx="35" cy="65" r="4" fill="white"/>
  <circle cx="65" cy="65" r="4" fill="white"/>
</svg>
